<style>

.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:20px}
.mhead button{border:0;background:#f1f5f9;border-radius:8px;width:32px;height:32px;cursor:pointer}
#mBody{padding:16px 18px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tst{background:#14532d;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px #0003;max-width:360px;animation:pop .2s}
.tst.err{background:#b91c1c}
#loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;display:none;overflow:hidden}
#loading::before{content:'';position:absolute;height:100%;width:40%;background:var(--gold);animation:ld 1s infinite linear}
@keyframes ld{from{left:-40%}to{left:100%}}
.rcpt{font-size:15px;max-width:320px;margin:0 auto}
.rcpt .rc-h{text-align:center;margin-bottom:8px}
.rcpt .rc-h b{font-size:20px}
.rcpt .rc-m{border-top:1px dashed #999;border-bottom:1px dashed #999;padding:6px 0;margin-bottom:6px;font-size:14px}
.rcpt td{padding:4px 0;border-bottom:0;font-size:15px}
#printArea{display:none}
/* stock count */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;position:relative}
.ccard.done{border-color:#86efac;background:#f7fdf9}
.ccard .chead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ccard .cok{position:absolute;top:10px;right:10px;color:var(--g6);display:none}
.ccard.done .cok{display:block}
.ccard input{font-size:20px!important;font-weight:600;text-align:right}
.cphoto{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cphoto img{width:100%;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.csys{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:-6px 0 10px;padding:6px 10px;background:#f1f5f9;border-radius:8px;color:#334155}
.csys b.neg{color:var(--red)}.csys b.pos{color:var(--g6)}
.rv-in{width:96px!important;text-align:right;font-weight:600;padding:6px 8px!important}
.rv-in.ed{border-color:var(--orange)!important;background:#fffbeb}
.cprog{height:10px;background:#eef2ef;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.cprog div{height:100%;background:var(--g5);transition:width .2s}
/* customer */
.custbox{background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:10px 12px 2px;margin-bottom:12px}
.custbox label.f{margin-bottom:8px}
.cinfo{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:8px 0 10px;border-top:1px dashed #d5ded8}
.cinfo .cbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pp s{color:var(--mu);font-weight:400;font-size:14px;margin-left:4px}
.pitem .ctag{font-size:13px;color:#1d4ed8}
.lockp{display:flex;gap:6px;align-items:center}
.lockp input[readonly]{background:#f3f5f4;color:var(--mu)}
.phead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.phead h2{margin:0 0 4px;font-size:28px}
.pmeta{display:flex;gap:18px;flex-wrap:wrap;color:var(--mu);font-size:15px}
.pmeta span{display:inline-flex;gap:6px;align-items:center}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.cp-set{color:#b45309}.cp-sale{color:#1d4ed8}
.below{color:var(--red);font-size:13px}
/* settings hub */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.scard.off{opacity:.5}
.scard .simg{height:130px;background:#f1f7f3;display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden}
.scard .simg img{width:100%;height:100%;object-fit:cover}
.scard .simg .up{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;opacity:0;transition:.15s}
.scard .simg:hover .up{opacity:1}
.scard .sb{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
.scard .sn{font-weight:600;font-size:17px}
.scard .sa{display:flex;gap:6px;padding:0 12px 12px}
.scard .sa .btn{flex:1}
.lchip{display:inline-flex;align-items:center;gap:6px;cursor:default;background:#f7faf8}
.lchip button{border:0;background:#fee2e2;color:#b91c1c;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:13px;line-height:1}
.imgedit{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.imgedit .imgbox{border:2px dashed #cfe3d6}
.emos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emos .chip{padding:3px 7px;font-size:21px}
.lk{margin-left:auto;font-size:14px;opacity:.7}
.lockbtn{margin-top:6px;border:1px solid #ffffff33;background:transparent;color:#d6ebdf;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow .sl b{display:block;font-weight:500}
.setrow select{width:auto;min-width:120px}
#overlay{display:none}
@media print{
  .app,.modal,#toast,#loading{display:none!important}
  #printArea{display:block}
  body{background:#fff}
  @page{margin:6mm}
}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.g3,.g3b{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  aside{transform:translateX(-100%)}aside.show{transform:none}
  #overlay.show{display:block;position:fixed;inset:0;background:#0006;z-index:45}
  main{margin-left:0}#menuBtn{display:grid}
  .kpis{grid-template-columns:1fr 1fr}.g2,.g3,.g3b,.g4,.pos{grid-template-columns:1fr}
  .top{padding:12px 14px}.top h1{font-size:23px}#view{padding:4px 12px 30px}
  .cart{position:static}
  .lrow,.lrow.po,.lrow.tr{grid-template-columns:1fr 1fr}
  .lrow>select{grid-column:1/-1}
}
</style>
</head>

<div class="modal hide" id="pinM" style="z-index:150"><div class="mbox" style="max-width:340px"><div class="mhead"><h3 style="display:flex;gap:8px;align-items:center" id="pinTitle">รหัสผู้ดูแล</h3><button onclick="pinDone(false)" id="pinClose"></button></div><div style="padding:16px 18px"><div class="muted" id="pinMsg">ส่วนนี้สำหรับเจ้าของร้าน</div><input id="pinIn" class="inp" type="password" inputmode="numeric" autocomplete="off" style="font-size:28px;text-align:center;letter-spacing:10px;margin:12px 0" onkeydown="if(event.key==='Enter')pinOk()"><div class="mact"><button class="btn" onclick="pinDone(false)">ยกเลิก</button><button class="btn p" onclick="pinOk()">ยืนยัน</button></div></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<datalist id="custList"></datalist>

<script>
const UI_VERSION='2026.09.30-5';
const S={settings:{},products:[],customers:[],shift:null,suppliers:[],page:'dashboard',cart:[],posMethod:'CASH',posCat:'',posQ:'',posCats:[],charts:{},stockTab:'overview'};
const MTH={CASH:'เงินสด',TRANSFER:'โอน',CREDIT:'เครดิต',UNPAID:'ค้างจ่าย',SPLIT:'แยกจ่าย'};
const MC={CASH:'#16a34a',TRANSFER:'#2563eb',CREDIT:'#f59e0b',UNPAID:'#ef4444',SPLIT:'#7c3aed'};
const MI={CASH:'cash',TRANSFER:'bank',CREDIT:'card',UNPAID:'user'};
const EXM={DRAWER:'เงินสดจากลิ้นชัก',TRANSFER:'โอนจากบัญชีร้าน',OWNER:'เจ้าของจ่ายเอง'};
const POM={DRAWER:'เงินสดจากลิ้นชักหน้าร้าน',CASH:'เงินสด (นอกลิ้นชัก)',TRANSFER:'โอน',CREDIT:'เครดิตร้านค้า (ค้างจ่าย)'};
const LOC={BACK:'หลังร้าน',FRONT:'หน้าร้าน'};
const RTM={CREDIT:'หักยอดค้างจ่ายร้านค้า',DRAWER:'รับเงินสดคืน (เข้าลิ้นชัก)',CASH:'รับเงินสดคืน (นอกลิ้นชัก)',TRANSFER:'รับโอนคืน'};
const SPM={TRANSFER:'โอน',DRAWER:'เงินสดจากลิ้นชัก',CASH:'เงินสด (นอกลิ้นชัก)'};
const MVT={COUNT_ADJ:'ปรับจากการนับปิดกะ',PURCHASE_RETURN:'คืนร้านค้า',PURCHASE_RETURN_CANCEL:'ยกเลิกคืนร้านค้า',OPENING:'ยอดยกมา',PURCHASE:'ซื้อเข้า',TRANSFER:'ย้ายคลัง',SALE:'ขาย',SALE_CANCEL:'ยกเลิกบิล',PROCESS_IN:'แปรรูป-ใช้',PROCESS_OUT:'แปรรูป-ได้',ADJUST:'ปรับยอด',WASTE:'ของเสีย'};
const MVC={COUNT_ADJ:'b-warn',PURCHASE_RETURN:'b-bad',PURCHASE_RETURN_CANCEL:'b-mute',OPENING:'b-mute',PURCHASE:'b-ok',TRANSFER:'b-blue',SALE:'b-warn',SALE_CANCEL:'b-mute',PROCESS_IN:'b-bad',PROCESS_OUT:'b-ok',ADJUST:'b-mute',WASTE:'b-bad'};

const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2h11.6L21.5 7H6.3"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3.2-5.5 7-5.5s7 2 7 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c2.4.6 4 2.3 4 5.2"/>',
box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',

bag:'<path d="M5 7h14l1 14H4z"/><path d="M9 7a3 3 0 016 0"/>',
receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',

tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',

function ico(n,s){s=s||20;return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;vertical-align:-.2em">${P[n]||''}</svg>`;}
const X=()=>ico('x',14);
const PAGES={
 dashboard:{t:'Dashboard',ic:'home',fn:()=>pgDashboard()},
 pos:{t:'หน้าขาย (POS)',ic:'cart',fn:()=>pgPOS()},
 sales:{t:'ประวัติการขาย',ic:'clock',fn:()=>pgSales()},
 recv:{t:'ค้างจ่ายลูกค้า',ic:'user',fn:()=>pgRecv()},
 customers:{t:'ลูกค้า',ic:'users',fn:()=>pgCustomers()},
 custProfile:{t:'โปรไฟล์ลูกค้า',ic:'user',fn:()=>pgCustProfile(),navKey:'customers'},
 stock:{t:'สต็อก หลังร้าน / หน้าร้าน',nav:'สต็อก',ic:'store',fn:()=>pgStock()},
 process:{t:'แปรรูป',ic:'knife',fn:()=>pgProcess()},
 purchase:{t:'ซื้อของเข้าร้าน',ic:'bag',fn:()=>pgPurchase()},
 expense:{t:'ค่าใช้จ่าย',ic:'receipt',fn:()=>pgExpense()},
 shift:{t:'เปิด / ปิดกะ',ic:'power',fn:()=>pgShift()},
 report:{t:'รายงาน',ic:'chart',fn:()=>pgReport(),lock:1},
 settings:{t:'ตั้งค่า',ic:'gear',fn:()=>pgSettings(),lock:1}
};
const NAV=['dashboard','pos','sales','recv','customers','|','stock','process','purchase','expense','shift','|','report','settings'];

const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0;};
const r2=n=>Math.round((num(n)+Number.EPSILON)*100)/100;
const fm=(n,d)=>{d=d==null?2:d;return num(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});};
const fq=n=>num(n).toLocaleString('th-TH',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function today(){return iso(new Date());}
function addD(s,n){const a=s.split('-').map(Number);return iso(new Date(a[0],a[1]-1,a[2]+n));}
function thDate(s){if(!s)return '-';const a=String(s).slice(0,10).split('-').map(Number);if(!a[0]||!a[1])return String(s);return a[2]+' '+TM[a[1]-1]+' '+String(a[0]+543).slice(-2);}
function thDT(s){if(!s)return '-';const t=String(s).replace('T',' ');return thDate(t)+' '+t.slice(11,16);}
function longDate(d){d=d||new Date();return 'วัน'+TD[d.getDay()]+'ที่ '+d.getDate()+' '+TMF[d.getMonth()]+' '+(d.getFullYear()+543);}
function list(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean);}
function opts(map,sel){return Object.keys(map).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${map[k]}</option>`).join('');}
function optsArr(arr,sel){return arr.map(k=>`<option ${k===sel?'selected':''}>${esc(k)}</option>`).join('');}
function img(p,sz){sz=sz||28;const im=String((p&&p.image)||'');if(/^https?:/.test(im))return `<img src="${esc(im)}" alt="">`;return `<span class="ph">${ico('image',Math.max(14,Math.round(sz*.7)))}</span>`;}
function imgBox(p,w,h,sz){return `<span class="imgbox" style="width:${w}px;height:${h||w}px">${img(p,sz||Math.round(w*.6))}</span>`;}
function prod(id){return S.products.find(p=>p.id===id);}
function stBadge(q,min){q=num(q);min=num(min);if(q<=0)return '<span class="b b-bad">หมด</span>';if(min>0&&q<min)return '<span class="b b-warn">ใกล้หมด</span>';return '<span class="b b-ok">พอใช้</span>';}
function mBadge(m){return `<span class="b b-${m}">${MTH[m]||m}</span>`;}

const STAT_TH={OK:'มีของ',LOW:'ใกล้หมด',OUT:'หมด'},STAT_B={OK:'b-ok',LOW:'b-warn',OUT:'b-bad'};
function statOf(p,loc){return (loc==='BACK'?p.bStat:p.fStat)||'OK';}
function qtyTxt(p,loc){const q=loc==='BACK'?p.stockBack:p.stockFront;return q==null?STAT_TH[statOf(p,loc)]:fq(q)+' '+p.unit;}

let _ld=0;
function loading(on){_ld=Math.max(0,_ld+(on?1:-1));$('#loading').style.display=_ld?'block':'none';}
function call(action,payload,quiet){
  const pl=Object.assign({},payload||{});
  if(authOk())pl._pin=S.auth.pin;
  if(!quiet)loading(true);
  return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(r=>{if(!quiet)loading(false);if(pl._pin&&S.auth)S.auth.at=Date.now();res(r);})
      .withFailureHandler(e=>{
        if(!quiet)loading(false);
        const m=(e&&e.message)||String(e);
        const need=m.indexOf('PIN_PRICE')>=0?'PRICE':(m.indexOf('PIN_REQUIRED')>=0?'OWNER':null);
        if(need){
          askPin(m.split(/PIN_(?:REQUIRED|PRICE):/).pop().trim(),need).then(ok=>{if(ok)call(action,payload,quiet).then(res,rej);else rej(e);});
          return;
        }
        toast(m,'err');rej(e);
      })
      .api(action,pl);
  });
}
let _pinRes=null,_pinWait=null,_pinNeed='OWNER';
const ROLE_TH={OWNER:'เจ้าของร้าน',STAFF:'พนักงาน'};
function authOk(){if(S.auth&&Date.now()-S.auth.at<15*60*1000)return true;if(S.auth){S.auth=null;setTimeout(()=>{updLock();reloadBase();},0);}return false;}
function pinValid(){return !S.settings.hasPin||(authOk()&&S.auth.user.role==='OWNER');}
function canPrice(){return !S.settings.hasPin||(authOk()&&S.auth.user.canPrice);}
function askPin(msg,need){
  if(_pinWait)return _pinWait;
  _pinNeed=need||'OWNER';
  _pinWait=new Promise(r=>{_pinRes=r;});
  $('#pinMsg').textContent=msg||(_pinNeed==='PRICE'?'ใส่รหัสผู้มีสิทธิ์ลดราคา (เจ้าของ หรือพนักงานที่ได้รับสิทธิ์)':_pinNeed==='ANY'?'ใส่รหัสของคุณ':'ส่วนนี้สำหรับเจ้าของร้าน — ใส่รหัสของคุณ');

  return _pinWait;
}
function pinDone(ok){$('#pinM').classList.add('hide');const r=_pinRes;_pinRes=null;_pinWait=null;if(r)r(ok);}
function pinOk(){
  const v=$('#pinIn').value.trim();if(!v)return;
  const bad=t=>{$('#pinMsg').textContent=t;$('#pinIn').value='';$('#pinIn').focus();};
  google.script.run.withSuccessHandler(u=>{
    if(!u)return bad('รหัสไม่ถูกต้อง กรุณาลองใหม่');
    if(_pinNeed==='OWNER'&&u.role!=='OWNER')return bad(u.name+' ไม่มีสิทธิ์ส่วนนี้ (ต้องเป็นเจ้าของร้าน)');
    if(_pinNeed==='PRICE'&&!u.canPrice)return bad(u.name+' ไม่มีสิทธิ์ลดราคา/เปลี่ยนราคา');
    S.auth={pin:v,user:u,at:Date.now()};updLock();toast('เข้าสู่ระบบ: '+u.name+' ('+ROLE_TH[u.role]+')');pinDone(true);
    if(u.role==='OWNER'&&(!hasQty()||S.page==='shift'))reloadBase().then(()=>{if(['dashboard','pos','stock','process','purchase','shift'].indexOf(S.page)>=0)render();});

}

function resizeImg(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.82));};
      im.onerror=()=>rej(new Error('เปิดไฟล์รูปไม่ได้'));im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function pickImage(cb,action,extra){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/'+'*';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{toast('กำลังอัปโหลดรูป...');const d=await resizeImg(f,700);const r=await call(action||'uploadImage',Object.assign({dataUrl:d,name:f.name},extra||{}));cb(r.url);}
    catch(e){if(e&&e.message&&e.message.indexOf('PIN')<0)toast(e.message,'err');}
  };
  inp.click();
}

function setFavicon(url){
  const f=$('#favIco'),t=$('#touchIco');if(!f)return;
  if(!url){try{localStorage.removeItem('shopLogo');}catch(e){}return;}
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{let u=url;try{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,128,128);u=c.toDataURL('image/png');}catch(e){}
    f.href=u;if(t)t.href=u;try{localStorage.setItem('shopLogo',u);}catch(e){}};

function pgPOS(){

  if(S.posCats.indexOf(S.posCat)<0)S.posCat='';
  const warn=(!S.shift&&S.settings.requireShift==='Y')?(S.pendingShift?`<div class="alert"><span style="display:flex;gap:8px;align-items:center">${ico('alert',18)} กะ ${S.pendingShift.shiftId} รอเจ้าของอนุมัติปิดกะ — ขายได้หลังเจ้าของอนุมัติและเปิดกะใหม่</span><button class="btn p sm" onclick="go('shift')">ดูรายละเอียด</button></div>`
    :`<div class="alert"><span style="display:flex;gap:8px;align-items:center">${ico('alert',18)} ยังไม่ได้เปิดกะ — ต้องเปิดกะก่อนจึงจะบันทึกการขายได้</span><button class="btn p sm" onclick="go('shift')">เปิดกะ</button></div>`):'';
  $('#view').innerHTML=`${warn}<div class="pos">

      <div class="poshead" style="display:flex;gap:10px;align-items:flex-start"><div class="chips" style="flex:1">${S.posCats.map((c,i)=>`<button class="chip ${S.posCat===c?'on':''}" onclick="S.posCat=S.posCats[${i}];pgPOS()">${c?esc(c):'ทั้งหมด'}</button>`).join('')}</div>
      <div class="psz">ขนาดรูป ${[['S','เล็ก'],['M','กลาง'],['L','ใหญ่']].map(z=>`<button class="${posSize()===z[0]?'on':''}" onclick="setPosSize('${z[0]}')">${z[1]}</button>`).join('')}</div></div>

    </div>
    <div class="card cart" id="cartPanel"></div>

  renderPosGrid();renderCart();

function priceFor(id){const cp=S.posPrices&&S.posPrices[id];return cp?cp.price:(prod(id)||{}).price||0;}

  setTimeout(()=>{['#pkQ','#pkP','#pkA'].forEach(x=>{const el=$(x);if(el)el.onkeydown=e=>{if(e.key==='Enter')pkAdd(id,edit?idx:null);};});},70);

function pkUnlock(){askPin('','PRICE').then(ok=>{if(!ok)return;const i=$('#pkP');if(!i)return;i.removeAttribute('readonly');i.focus();i.select();const b=$('#pkUnl');if(b)b.remove();if(S.posCustId)$('#pkOneW').style.display='flex';});}
function pkUpd(){$('#pkT').textContent=fm(num($('#pkQ').value)*num($('#pkP').value));$('#pkA').value='';}
function pkAmt(){const a=num($('#pkA').value),pr=num($('#pkP').value);if(pr>0)$('#pkQ').value=Math.round(a/pr*1000)/1000;$('#pkT').textContent=fm(a);}
function pkAdd(id,idx){
  const p=prod(id),q=Math.round(num($('#pkQ').value)*1000)/1000,pr=r2($('#pkP').value);
  if(!(q>0))return toast('ใส่จำนวนให้ถูกต้อง','err');
  const manual=Math.abs(pr-priceFor(id))>0.004,oneOff=manual&&!!($('#pkOne')&&$('#pkOne').checked);
  if(idx!=null){Object.assign(S.cart[idx],{qty:q,price:pr,manual:manual,oneOff:oneOff});}
  else{const ex=S.cart.find(c=>c.productId===id&&c.price===pr&&!!c.oneOff===oneOff);
    if(ex)ex.qty=Math.round((ex.qty+q)*1000)/1000;else S.cart.push({productId:id,name:p.name,unit:p.unit,qty:q,price:pr,manual:manual,oneOff:oneOff});}
  closeModal();renderCart();
}
async function posSetCust(name){
  name=(name||'').trim();S.posCust=name;
  const c=S.customers.find(x=>x.name===name);
  S.posCustId=c?c.id:'';S.posPrices={};S.posLast=null;S.posCustInfo=null;
  if(c){try{const r=await call('getCustomerPrices',{customerId:c.id},true);if(S.posCustId!==c.id)return;S.posPrices=r.prices||{};S.posLast=r.lastBill;S.posCustInfo=r.info;}catch(e){}}
  S.cart.forEach(it=>{if(!it.manual)it.price=priceFor(it.productId);});
  if(S.page==='pos'){renderCart();renderPosGrid();}
}
function posRepeat(){
  const lb=S.posLast;if(!lb)return;let n=0;
  lb.items.forEach(i=>{const p=prod(i.productId);if(!p||p.active==='N')return;n++;
    const pr=priceFor(i.productId),ex=S.cart.find(c=>c.productId===i.productId&&c.price===pr&&!c.oneOff);
    if(ex)ex.qty=Math.round((ex.qty+num(i.qty))*1000)/1000;else S.cart.push({productId:p.id,name:p.name,unit:p.unit,qty:num(i.qty),price:pr,manual:false,oneOff:false});});
  toast('ดึงรายการจากบิล '+lb.billNo+' ('+n+' รายการ) — แก้จำนวนได้');renderCart();
}
function cartSub(){return r2(S.cart.reduce((s,c)=>s+r2(c.qty*c.price),0));}
function cartQty(i,v){const q=Math.round(num(v)*1000)/1000;if(q<=0)S.cart.splice(i,1);else S.cart[i].qty=q;renderCart();}

  ${(m==='CREDIT'||m==='UNPAID')?'<div class="muted small" style="margin:-4px 0 8px">* ต้องใส่ชื่อลูกค้า — ยอดจะไปอยู่หน้า "ค้างจ่ายลูกค้า"</div>':''}

function posTot(){return Math.max(0,r2(cartSub()-num(S.posDisc)));}
function setPayMethod(k){S.posMethod=k;if(k==='SPLIT'){S.spC='';S.spT='';S.spMan={C:false,T:false};}S.posRecv='';renderCart();}
function spIn(k,v){S.spMan=S.spMan||{};S.spMan[k]=true;if(k==='C')S.spC=v;else S.spT=v;
  const o=k==='C'?'T':'C';if(!S.spMan[o]&&v!==''){const rem=Math.max(0,r2(posTot()-num(v)));if(o==='T')S.spT=rem;else S.spC=rem;const el=$('#sp'+o);if(el)el.value=rem;}
  spStatus();updTotal();}
function spFill(k){const other=k==='C'?num(S.spT):num(S.spC);const rem=Math.max(0,r2(posTot()-other));if(k==='C')S.spC=rem;else S.spT=rem;const el=$('#sp'+k);if(el)el.value=rem;S.spMan=S.spMan||{};S.spMan[k]=true;spStatus();updTotal();}
function spStatus(){const el=$('#spSt');if(!el)return;const t=posTot(),paid=r2(num(S.spC)+num(S.spT)),d=r2(t-paid);
  el.className='spst '+(Math.abs(d)<0.005?'ok':d>0?'short':'over');
  el.innerHTML=Math.abs(d)<0.005?`<span>รับครบ</span><b>${fm(paid)}</b>`:d>0?`<span>ยังขาด (จะเป็นค้างจ่ายของลูกค้า)</span><b>${fm(d)}</b>`:`<span>รับเกินยอดบิล</span><b>${fm(-d)}</b>`;}
function updTotal(){const t=posTot();$('#posTotal').textContent=fm(t);const cashDue=S.posMethod==='SPLIT'?num(S.spC):t;const ch=$('#posChg');if(ch){const r=num(S.posRecv);ch.textContent=r?fm(r-cashDue):'0.00';ch.style.color=r&&r<cashDue?'var(--red)':'';}if(S.posMethod==='SPLIT')spStatus();}
let _posBusy=false;
async function posSubmit(){
  if(_posBusy||!S.cart.length)return;
  const m=S.posMethod,name=(S.posCust||'').trim(),total=posTot();
  if((m==='CREDIT'||m==='UNPAID')&&!name)return toast('ขายเครดิต/ค้างจ่าย ต้องใส่ชื่อลูกค้า','err');
  const recv=(m==='CASH'||m==='SPLIT')?num(S.posRecv):0;
  if(m==='CASH'&&recv&&recv<total)return toast('รับเงินมาไม่พอ','err');
  if(m==='SPLIT'){const paid=r2(num(S.spC)+num(S.spT));
    if(S.spC===''&&S.spT==='')return toast('ใส่ยอดเงินสด / โอน','err');
    if(paid>total+0.005)return toast('เงินสด + โอน เกินยอดบิล','err');
    if(paid<total-0.005&&!name)return toast('ยังขาด '+fm(total-paid)+' — ใส่ชื่อลูกค้าเพื่อบันทึกเป็นค้างจ่าย','err');
    if(recv&&recv<num(S.spC))return toast('รับเงินสดมาไม่พอ','err');}
  const c=S.customers.find(x=>x.name===name);
  _posBusy=true;S.lastSpC=S.spC;
  try{
    const r=await call('createSale',{items:S.cart.map(i=>({productId:i.productId,qty:i.qty,price:i.price,oneOff:!!i.oneOff})),customerId:c?c.id:'',customerName:name,method:m,payCash:m==='SPLIT'?num(S.spC):'',payTransfer:m==='SPLIT'?num(S.spT):'',discount:num(S.posDisc),note:S.posNote||'',dueDate:m==='CREDIT'?(S.posDue||addD(today(),num(S.settings.defaultCreditDays)||7)):'',cashier:S.shift?S.shift.openBy:''});
    S.cart=[];S.posDisc='';S.posRecv='';S.posCust='';S.posCustId='';S.posPrices={};S.posLast=null;S.posCustInfo=null;S.posNote='';S.posDue='';S.posMethod='CASH';S.spC='';S.spT='';S.spMan={};
    toast('บันทึกบิล '+r.sale.billNo+' แล้ว'+(r.sale.approvedBy?' · อนุมัติราคาโดย '+r.sale.approvedBy:''));
    if(S.auth&&S.auth.user.role!=='OWNER'){S.auth=null;updLock();}   // พนักงานต้องใส่รหัสใหม่ทุกบิลที่ลดราคา
    await reloadBase();
    if(S.page==='pos')pgPOS();
    const extra={received:recv,cashDue:m==='SPLIT'?num(S.lastSpC):r.sale.total};
    S.lastRc={sale:r.sale,items:r.items,extra:extra};
    modal('บันทึกการขายสำเร็จ',receiptHTML(r.sale,r.items,extra)+`<div class="mact"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="printHTML(receiptHTML(S.lastRc.sale,S.lastRc.items,S.lastRc.extra))">${ico('print',16)} พิมพ์ใบเสร็จ</button></div>`);
  }catch(e){}finally{_posBusy=false;}
}

function procSum(){
  let iq=0,oq=0,ic=0;
  S.proc.inputs.forEach(r=>{const p=prod(r.productId);if(p){iq+=num(r.qty);ic+=num(r.qty)*p.cost;}});
  S.proc.outputs.forEach(r=>{if(r.productId)oq+=num(r.qty);});
  const loss=iq-oq;
  $('#pSum').innerHTML=`<div class="sum-l"><span>น้ำหนัก/จำนวนวัตถุดิบ</span><b>${fq(iq)}</b></div><div class="sum-l"><span>ได้สินค้ารวม</span><b>${fq(oq)}</b></div><div class="sum-l" style="color:var(--red)"><span>สูญเสีย</span><b>${fq(loss)} ${iq?'('+(loss/iq*100).toFixed(1)+'%)':''}</b></div><div class="sum-l"><span>ต้นทุนวัตถุดิบ</span><b>${fm(ic)}</b></div><div class="sum-l hl"><span>ต้นทุนเฉลี่ยต่อหน่วยที่ได้</span><span>${oq?fm(ic/oq):'-'}</span></div>`;
}

function salesPayRows(x){
  const rows=[['เงินสด',x.byMethod.CASH],['เงินโอน',x.byMethod.TRANSFER],['เครดิต',x.byMethod.CREDIT],['ค้างจ่าย',x.byMethod.UNPAID]];
  return rows.map(r=>`<div class="sum-l"${num(r[1])?'':' style="color:var(--mu)"'}><span>${r[0]}</span><b>${fm(r[1])}</b></div>`).join('')
    +`<div class="sum-l" style="border-top:1px dashed var(--line);margin-top:4px;padding-top:8px"><span>ยอดรวม (ก่อนส่วนลด)</span><span>${fm(x.subtotal)}</span></div>
    <div class="sum-l"><span>ส่วนลด</span><span${num(x.discount)?' style="color:var(--red)"':''}>${num(x.discount)?'-':''}${fm(x.discount)}</span></div>
    <div class="sum-l"><span>ยกเลิกบิล${x.cancelledCount?' ('+x.cancelledCount+' บิล)':''}</span><span${x.cancelledCount?' style="color:var(--red)"':''}>${fm(x.cancelledAmount)}</span></div>
    <div class="sum-l t"><span>ยอดรวมสุทธิ (${x.billCount} บิล)</span><span>${fm(x.total)}</span></div>`;
}
function salesSumCard(g,btn){
  const x=g.sales;if(!x)return '';
  return `<div class="card" style="margin-bottom:16px"><div class="ch"><h3>${ico('list',18)} สรุปรายการสินค้า (ยอดขายกะนี้)</h3>${btn?`<button class="btn sm ol" onclick="${btn}">${ico('print',16)} พิมพ์สรุปยอดขาย</button>`:''}</div>
  <div class="grid g2" style="margin:0;align-items:start"><div class="tw"><table><tr><th style="width:40px">#</th><th>สินค้า</th><th class="r">จำนวน</th><th class="r">บิล</th><th class="r">ยอดขาย</th></tr>
  ${x.items.map((i,n)=>`<tr><td class="muted">${n+1}</td><td><b>${esc(i.name)}</b></td><td class="r nw">${fq(i.qty)} ${esc(i.unit||'')}</td><td class="r muted">${i.bills}</td><td class="r nw"><b>${fm(i.amount)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">กะนี้ยังไม่มีการขาย</td></tr>'}
  ${x.items.length?`<tfoot><tr><td></td><td>รวม ${x.items.length} รายการ</td><td></td><td></td><td class="r">${fm(x.subtotal)}</td></tr></tfoot>`:''}</table></div>
  <div>${salesPayRows(x)}</div></div></div>`;
}
function salesSlipHTML(g){
  const s=g.shift,x=g.sales,dash='<div style="border-top:1px dashed #999;margin:6px 0"></div>';
  const ln=(a,b,st)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;${st||''}"><span>${a}</span><span style="white-space:nowrap">${b}</span></div>`;
  const d=String(s.openTime||'').slice(0,10).split('-');
  return `<div class="rcpt"><div class="rc-h"><b>${esc(S.settings.shopName)}</b><div>${esc(S.settings.branch||'')}</div></div>${dash}
  <div style="text-align:center;font-size:18px;font-weight:600">สรุปยอดขาย ${d.length===3?d[2]+'/'+d[1]+'/'+d[0]:''}</div>
  <div style="text-align:center;font-size:13px">กะ ${s.shiftId} · ${esc(s.openBy||'-')}${s.closeBy?' / '+esc(s.closeBy):''}</div>${dash}
  ${x.items.map((i,n)=>ln((n+1)+'. '+esc(i.name),fm(i.amount)+' ('+fq(i.qty)+')','border-bottom:1px dashed #ccc')).join('')||ln('ไม่มีการขาย','')}${dash}
  ${ln('เงินสด',fm(x.byMethod.CASH))}${ln('เงินโอน',fm(x.byMethod.TRANSFER))}${ln('เครดิต',fm(x.byMethod.CREDIT))}${ln('ค้างจ่าย',fm(x.byMethod.UNPAID))}${dash}
  ${ln('ยอดรวม',fm(x.subtotal))}${ln('ส่วนลด',fm(x.discount))}${ln('ยกเลิกบิล'+(x.cancelledCount?' ('+x.cancelledCount+')':''),fm(x.cancelledAmount))}${ln('<b>ยอดรวมสุทธิ ('+x.billCount+' บิล)</b>','<b>'+fm(x.total)+'</b>')}
  <div style="text-align:center;margin-top:16px;font-size:13px">** วันที่พิมพ์ ${(()=>{const n=new Date(),z=v=>String(v).padStart(2,'0');return z(n.getDate())+'/'+z(n.getMonth()+1)+'/'+n.getFullYear()+' '+z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds());})()} **</div></div>`;
}

function pgReport(){
  const f=S.rpF||(S.rpF={from:today(),to:today()});
  const t=today(),d=new Date();
  const q={'วันนี้':[t,t],'เมื่อวาน':[addD(t,-1),addD(t,-1)],'7 วัน':[addD(t,-6),t],'เดือนนี้':[iso(new Date(d.getFullYear(),d.getMonth(),1)),t],'เดือนก่อน':[iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))]};
  S.rpQ=q;
  $('#view').innerHTML=`<div class="card" style="margin-bottom:16px"><div class="row"><label class="f">ตั้งแต่<input type="date" id="rF" value="${f.from}"></label><label class="f">ถึง<input type="date" id="rT" value="${f.to}"></label><div class="fx0" style="margin-bottom:10px"><button class="btn p" onclick="S.rpF={from:$('#rF').value,to:$('#rT').value};rpLoad()">ดูรายงาน</button></div></div>
  <div class="chips" style="margin:0">${Object.keys(q).map(k=>`<button class="chip" onclick="S.rpF={from:S.rpQ['${k}'][0],to:S.rpQ['${k}'][1]};pgReport()">${k}</button>`).join('')}</div></div><div id="rpRes"></div>`;
  rpLoad();
}
async function rpLoad(){
  const r=await call('getReport',S.rpF);if(S.page!=='report')return;
  const k=(l,v,col)=>`<div class="card"><div class="kl muted small">${l}</div><div class="kv" style="font-size:25px;font-weight:600;color:${col||'var(--tx)'}">${fm(v)}</div></div>`;
  $('#rpRes').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(4,1fr)">${k('ยอดขาย ('+r.bills+' บิล)',r.total,'var(--g6)')}${k('ต้นทุนขาย (ประมาณ)',r.cost)}${k('กำไรขั้นต้น',r.gross,'var(--g6)')}${k('ค่าใช้จ่าย',r.expense,'var(--red)')}${k('กำไรหลังหักค่าใช้จ่าย',r.net,r.net>=0?'var(--g7)':'var(--red)')}${k('ซื้อของเข้าร้าน'+(r.purchaseReturn?' (หักคืน '+fm(r.purchaseReturn)+')':''),r.purchase-r.purchaseReturn,'var(--orange)')}${k('ค้างจ่ายร้านค้า (ทั้งหมด)',r.payable,'var(--purple)')}${k('ค้างรับลูกค้า (ทั้งหมด)',r.receivable,'var(--red)')}${k('มูลค่าสต็อก (หลัง+หน้า)',r.stockBackValue+r.stockFrontValue,'var(--blue)')}</div>
  <div class="grid g2"><div class="card"><div class="ch"><h3>ยอดขายรายวัน</h3></div><div class="chartbox"><canvas id="cDay"></canvas></div></div>
  <div class="card"><div class="ch"><h3>แยกช่องทางชำระ</h3></div>${['CASH','TRANSFER','CREDIT','UNPAID'].map(m=>`<div class="sum-l"><span>${mBadge(m)}</span><b>${fm(r.byMethod[m])}</b></div>`).join('')}<div class="sum-l t"><span>รวม</span><span>${fm(r.total)}</span></div><div class="sec-t">รับชำระหนี้ในช่วงนี้</div><div class="sum-l"><span>เงินสด / โอน</span><span>${fm(r.collect.CASH)} / ${fm(r.collect.TRANSFER)}</span></div>${r.discount?`<div class="sum-l muted"><span>ส่วนลดที่ให้</span><span>${fm(r.discount)}</span></div>`:''}</div></div>
  <div class="grid g2"><div class="card"><div class="ch"><h3>ยอดขายตามสินค้า</h3></div><div class="tw"><table><tr><th>สินค้า</th><th class="r">จำนวน</th><th class="r">ยอดขาย</th><th class="r">ต้นทุน</th><th class="r">กำไร</th></tr>${r.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="r nw">${fq(p.qty)} ${esc(p.unit)}</td><td class="r">${fm(p.amount)}</td><td class="r">${fm(p.cost)}</td><td class="r" style="color:${p.profit>=0?'var(--g6)':'var(--red)'}">${fm(p.profit)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>'}</table></div></div>
  <div class="card"><div class="ch"><h3>ค่าใช้จ่ายตามหมวด</h3></div><div class="tw"><table>${r.expenses.map(e=>`<tr><td>${esc(e.category)}</td><td class="r">${fm(e.amount)}</td></tr>`).join('')||'<tr><td class="empty">ไม่มีข้อมูล</td></tr>'}<tfoot><tr><td>รวม</td><td class="r">${fm(r.expense)}</td></tr></tfoot></table></div>
  <div class="ch" style="margin-top:16px"><h3>ซื้อของตามร้านค้า</h3></div><div class="tw"><table>${r.suppliers.map(e=>`<tr><td>${esc(e.supplier)}</td><td class="r">${fm(e.amount)}</td></tr>`).join('')||'<tr><td class="empty">ไม่มีข้อมูล</td></tr>'}</table></div></div></div>
  <div class="muted small">* ต้นทุนขายคำนวณจาก "ต้นทุน/หน่วย" ปัจจุบันของสินค้า × จำนวนที่ขาย</div>`;
  if(typeof Chart!=='undefined'&&(chartSetup(),1))S.charts.d=new Chart($('#cDay'),{type:'bar',data:{labels:r.days.map(x=>{const a=x.date.split('-');return +a[2]+' '+TM[+a[1]-1];}),datasets:[{data:r.days.map(x=>x.total),backgroundColor:'#34b36b',borderRadius:5,maxBarThickness:36}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}});
}

const SET_TABS=[['products','box','สินค้า'],['lists','tag','หมวดหมู่ & หน่วย'],['users','staff','ผู้ใช้ & รหัส'],['suppliers','truck','ร้านค้าที่ซื้อของ'],['shop','store','ข้อมูลร้าน'],['count','list','การนับสต็อก'],['audit','clock','ประวัติการแก้ไข'],['system','gear','ระบบ']];
function pgSettings(){
  const t=S.setTab||(S.setTab='products');
  $('#view').innerHTML=`<div class="tabs">${SET_TABS.map(x=>`<div class="tab ${t===x[0]?'on':''}" onclick="S.setTab='${x[0]}';pgSettings()" style="display:inline-flex;gap:7px;align-items:center">${ico(x[1],16)} ${x[2]}</div>`).join('')}</div><div id="setBody"></div>`;
  ({products:setProducts,lists:setLists,
    users:setUsers,audit:setAudit,count:setCount,
    suppliers:()=>{$('#setBody').innerHTML=`<div class="grid g2">${listEd('suppliers','ร้านค้า / ผู้ขายที่ซื้อของประจำ','ใช้เลือกตอนเปิดบิลซื้อของเข้าร้าน (ร้านใหม่ที่พิมพ์ในบิลซื้อจะถูกเพิ่มให้อัตโนมัติ)')}</div>`;},
    shop:setShop,system:setSystem})[t]();
}
async function saveKeys(obj,msg){
  try{S.settings=await call('saveSettings',obj);applyBrand();toast(msg||'บันทึกแล้ว');await reloadBase();if(S.page==='settings')pgSettings();return true;}catch(e){return false;}
}

function setProducts(){
  const cats=['',...new Set(S.products.map(p=>p.category).filter(Boolean))];S.spCats=cats;
  if(cats.indexOf(S.prodCat||'')<0)S.prodCat='';
  const act=S.products.filter(p=>p.active!=='N').length;
  $('#setBody').innerHTML=`<div class="card"><div class="ch"><h3>สินค้าทั้งหมด (${act} รายการ)</h3>
    <div class="row" style="flex:0 1 560px;align-items:center">
      <input class="inp" placeholder="ค้นหาสินค้า / รหัส" value="${esc(S.prodQ||'')}" oninput="S.prodQ=this.value;prodGrid()">
      <label class="small fx0 nw"><input type="checkbox" ${S.prodAll?'checked':''} onchange="S.prodAll=this.checked;prodGrid()"> แสดงที่ปิดใช้</label>
      <div class="fx0"><button class="btn p" onclick="productModal()">${ico('plus',16)} เพิ่มสินค้า</button></div></div></div>
    <div class="chips">${cats.map((c,i)=>`<button class="chip ${(S.prodCat||'')===c?'on':''}" onclick="S.prodCat=S.spCats[${i}];setProducts()">${c?esc(c):'ทั้งหมด'}</button>`).join('')}</div>
    <div class="hint" style="margin-bottom:10px">แตะที่รูปสินค้าเพื่ออัปโหลด/ถ่ายรูปใหม่ได้ทันที · แก้จำนวนสต็อกได้ที่เมนู สต็อก → ปรับยอด</div>
    <div id="prodG" class="sgrid"></div></div>`;
  prodGrid();
}
function prodGrid(){
  const q=(S.prodQ||'').toLowerCase();
  const l=S.products.filter(p=>(S.prodAll||p.active!=='N')&&(!S.prodCat||p.category===S.prodCat)&&(!q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)));
  $('#prodG').innerHTML=l.map(p=>`<div class="scard ${p.active==='N'?'off':''}">
    <div class="simg" onclick="quickImg('${p.id}')">${/^https?:/.test(p.image)?`<img src="${esc(p.image)}" alt="">`:`<span class="ph" style="flex-direction:column;gap:4px">${ico('camera',30)}<span class="small">เพิ่มรูปสินค้า</span></span>`}<span class="up">${ico('camera',13)} เปลี่ยนรูป</span></div>
    <div class="sb"><div class="sn">${esc(p.name)}</div>
      <div class="muted small">${p.id} · ${esc(p.category||'-')} · ${esc(p.unit)}</div>
      <div class="sum-l" style="padding:2px 0"><span class="muted small">ราคาขาย</span><b style="color:var(--g6)">${fm(p.price)}</b></div>
      <div class="sum-l" style="padding:2px 0"><span class="muted small">ต้นทุน</span><span>${fm(p.cost)}</span></div>
      <div class="sum-l" style="padding:2px 0"><span class="muted small">หลังร้าน / หน้าร้าน</span><span>${fq(p.stockBack)} / ${fq(p.stockFront)}</span></div>
      <div>${p.sellable==='N'?'<span class="b b-mute">วัตถุดิบ (ไม่ขาย)</span>':'<span class="b b-ok">ขายหน้าร้าน</span>'} ${p.active==='N'?'<span class="b b-bad">ปิดใช้</span>':''}</div></div>
    <div class="sa"><button class="btn sm" onclick="productModal('${p.id}')">${ico('edit',14)} แก้ไข</button>${p.active==='N'?`<button class="btn sm p" onclick="prodActive('${p.id}',true)">เปิดใช้</button>`:`<button class="btn sm ol" onclick="prodActive('${p.id}',false)">ปิดใช้</button>`}</div>
  </div>`).join('')||'<div class="empty">ไม่พบสินค้า</div>';
}
function quickImg(id){
  const p=prod(id);
  pickImage(async url=>{try{await call('saveProduct',{id:id,name:p.name,image:url});toast('เปลี่ยนรูปแล้ว');await reloadBase();if(S.page==='settings')prodGrid();}catch(e){}});
}
async function prodActive(id,on){
  const p=prod(id);
  if(!on&&!confirm('ปิดใช้ "'+p.name+'" ? (สินค้าจะหายจากหน้าขาย แต่ประวัติยังอยู่)'))return;
  try{await call('deleteProduct',{id:id,restore:on});toast(on?'เปิดใช้แล้ว':'ปิดใช้แล้ว');await reloadBase();setProducts();}catch(e){}
}
function selWith(arr,val){if(val&&arr.indexOf(val)<0)arr=[val].concat(arr);return arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');}
function productModal(id){
  const p=id?prod(id):{name:'',category:list(S.settings.productCategories)[0]||'',unit:list(S.settings.units)[0]||'กก.',price:'',cost:'',minFront:'',minBack:'',image:'',sellable:'Y',active:'Y'};
  S.pdImg=/^https?:/.test(p.image||'')?p.image:'';
  modal(id?'แก้ไขสินค้า '+id:'เพิ่มสินค้าใหม่',`
  <div class="imgedit"><div id="pdPrev" class="imgbox" style="width:120px;height:120px"></div>
    <div style="flex:1;min-width:200px"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm p" onclick="pickImage(u=>{S.pdImg=u;pdPrev();})">${ico('camera',15)} อัปโหลด / ถ่ายรูป</button><button class="btn sm" onclick="S.pdImg='';pdPrev()">ลบรูป</button></div>
    <div class="hint" style="margin-top:8px">รองรับ JPG / PNG ระบบย่อรูปให้อัตโนมัติ<br>แนะนำถ่ายบนพื้นเรียบ แสงสว่าง</div></div></div>
  <label class="f">ชื่อสินค้า<input id="pdN" value="${esc(p.name)}" autofocus></label>
  <div class="row"><label class="f">หมวดหมู่<select id="pdC">${selWith(list(S.settings.productCategories),p.category)}</select></label><label class="f">หน่วยนับ<select id="pdU">${selWith(list(S.settings.units),p.unit)}</select></label></div>
  <div class="hint" style="margin:-4px 0 10px">เพิ่มหมวดหมู่/หน่วยใหม่ได้ที่แท็บ "หมวดหมู่ & หน่วย"</div>
  <div class="row"><label class="f">ราคาขาย / หน่วย<input id="pdP" type="number" step="any" inputmode="decimal" value="${p.price}"></label><label class="f">ต้นทุน / หน่วย<input id="pdK" type="number" step="any" inputmode="decimal" value="${p.cost}"></label></div>
  <div class="row"><label class="f">ขั้นต่ำหน้าร้าน (เตือนให้เติม)<input id="pdMF" type="number" step="any" value="${p.minFront}"></label><label class="f">ขั้นต่ำหลังร้าน (เตือนให้สั่งซื้อ)<input id="pdMB" type="number" step="any" value="${p.minBack}"></label></div>
  ${id?'':`<div class="row"><label class="f">สต็อกยกมา หลังร้าน<input id="pdSB" type="number" step="any"></label><label class="f">สต็อกยกมา หน้าร้าน<input id="pdSF" type="number" step="any"></label></div>`}
  <label class="f">ประเภท<select id="pdS">${opts({Y:'ขายหน้าร้าน (แสดงในหน้าขาย)',N:'วัตถุดิบ (ใช้แปรรูป ไม่แสดงในหน้าขาย)'},p.sellable)}</select></label>
  <div class="sec-t" style="margin:6px 0 10px">การนับสต็อกตอนปิดกะ</div>
  <div class="row"><label class="f">นับตอนปิดกะ<select id="pdCM">${opts({Y:'ต้องนับทุกกะ',N:'ไม่ต้องนับ (ยกยอดไปเลย)'},id?(p.countMode||'N'):'Y')}</select></label><label class="f">นับที่<select id="pdCL">${opts({BOTH:'หน้าร้าน + หลังร้าน',FRONT:'หน้าร้านอย่างเดียว',BACK:'หลังร้านอย่างเดียว'},p.countLoc||'BOTH')}</select></label></div>
  <div class="row"><label class="f">ยอมคลาดเคลื่อนได้ (%)<input id="pdTol" type="number" step="any" value="${p.tolerance!=null?p.tolerance:''}" placeholder="ใช้ค่าเริ่มต้น ${esc(S.settings.countTolerance||3)}%"></label><label class="small" style="display:flex;gap:8px;align-items:center;margin-top:18px"><input type="checkbox" id="pdCP" ${p.countPhoto==='Y'?'checked':''}> บังคับถ่ายรูปหลักฐานตอนนับ</label></div>
  <div class="mact"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="prodSave('${id||''}')">${ico('save',16)} บันทึก</button></div>`);
  pdPrev();
}
function pdPrev(){const el=$('#pdPrev');if(el)el.innerHTML=img({image:S.pdImg},48);}
async function prodSave(id){
  const d={id:id,name:$('#pdN').value,category:$('#pdC').value,unit:$('#pdU').value,price:num($('#pdP').value),cost:num($('#pdK').value),minFront:num($('#pdMF').value),minBack:num($('#pdMB').value),image:S.pdImg||'',sellable:$('#pdS').value,countMode:$('#pdCM').value,countLoc:$('#pdCL').value,countPhoto:$('#pdCP').checked?'Y':'N',tolerance:$('#pdTol').value};
  if(!id){d.stockBack=num($('#pdSB').value);d.stockFront=num($('#pdSF').value);}
  if(!d.name.trim())return toast('ใส่ชื่อสินค้า','err');
  try{await call('saveProduct',d);toast('บันทึกสินค้าแล้ว');closeModal();await reloadBase();if(S.page==='settings')setProducts();}catch(e){}
}

function listEd(key,title,hint){
  const arr=list(S.settings[key]);
  return `<div class="card"><div class="ch"><h3>${title}</h3><span class="muted small">${arr.length} รายการ</span></div>${hint?`<div class="hint" style="margin:-6px 0 12px">${hint}</div>`:''}

      <div class="setrow"><div class="sl"><b>สำรองชีตก่อนรีเซ็ต</b><span class="hint">ทำสำเนา Google Sheet ไว้ใน Drive เผื่อต้องย้อนดู</span></div><select class="inp" id="rsBk"><option value="Y">สำรองไว้ (แนะนำ)</option><option value="N">ไม่ต้อง</option></select></div>
      <label class="f" style="margin-top:10px">พิมพ์คำว่า <b>รีเซ็ต</b> เพื่อยืนยัน<input id="rsCf" placeholder="รีเซ็ต"></label>
      <button class="btn" style="background:var(--red);color:#fff;border-color:var(--red);width:100%" onclick="resetDataUI()">${ico('refresh',16)} ลบข้อมูลและเริ่มใหม่</button></div></div></div>`;
  call('getAdminInfo',{},true).then(r=>{const el=$('#admInfo');if(el)el.innerHTML=`<div class="sum-l"><span style="display:flex;gap:8px;align-items:center">${ico('sheet',16)} Google Sheet ข้อมูลทั้งหมด (สำรอง/ส่งออก)</span><a class="btn sm" href="${esc(r.sheetUrl)}" target="_blank">เปิด</a></div>${r.folderUrl?`<div class="sum-l"><span style="display:flex;gap:8px;align-items:center">${ico('folder',16)} โฟลเดอร์รูปสินค้าใน Google Drive</span><a class="btn sm" href="${esc(r.folderUrl)}" target="_blank">เปิด</a></div>`:''}<div class="hint" style="margin-top:6px">ไม่ต้องแชร์ชีตให้ลูกน้อง — ลูกน้องใช้แค่ลิงก์เว็บก็พอ</div>`;}).catch(()=>{});
  const vb=$('#verBox');if(vb){const ok=S.codeVersion===UI_VERSION;vb.innerHTML=`<div class="sum-l"><span>เวอร์ชันหน้าเว็บ (Index.html)</span><b>${UI_VERSION}</b></div><div class="sum-l"><span>เวอร์ชันเซิร์ฟเวอร์ (Code.gs)</span><b style="color:${ok?'var(--g6)':'var(--red)'}">${esc(S.codeVersion||'เก่ากว่า / ยังไม่อัปเดต')}</b></div>${ok?'':'<div class="small" style="color:var(--red);margin-top:6px">ไฟล์ 2 ตัวไม่ใช่รุ่นเดียวกัน — วาง Code.gs และ Index.html ชุดล่าสุดให้ครบ แล้ว Deploy เป็น New version</div>'}`;}
}
async function resetDataUI(){
  const cf=$('#rsCf').value.trim();if(cf!=='รีเซ็ต'){toast('พิมพ์คำว่า รีเซ็ต ในช่องยืนยันก่อน','err');$('#rsCf').focus();return;}
  const ks=$('#rsStock').value==='Y',kc=$('#rsCus').value==='Y',bk=$('#rsBk').value==='Y';
  if(!confirm('ยืนยันลบข้อมูลการขาย กะ ซื้อ ค่าใช้จ่าย ทั้งหมด?\nสต็อก: '+(ks?'คงยอดเดิม':'ตั้งเป็น 0')+'\nลูกค้า: '+(kc?'เก็บไว้':'ลบ')+'\n\nย้อนกลับไม่ได้'+(bk?' (มีสำเนาสำรองใน Drive)':'')))return;
  try{const r=await call('resetData',{confirm:cf,keepStock:ks,keepCustomers:kc,backup:bk});
    S.cs=null;S.cd={};S.rv=null;S.cart=[];S.csDirty=false;await reloadBase();
    toast('รีเซ็ตเรียบร้อย เริ่มใช้งานใหม่ได้เลย');
    if(r.backupUrl)modal('รีเซ็ตเรียบร้อย',`<div class="sum-l"><span>ลบบิลขาย</span><b>${r.counts.Sales}</b></div><div class="sum-l"><span>ลบกะ</span><b>${r.counts.Shifts}</b></div><div class="sum-l"><span>สำเนาสำรอง</span><a class="btn sm" href="${esc(r.backupUrl)}" target="_blank">เปิดสำเนา</a></div><div class="mact"><button class="btn p" onclick="closeModal();go('shift')">ไปเปิดกะแรก</button></div>`);
    else go('shift');
  }catch(e){}
}
function setCount(){
  const l=S.products.filter(p=>p.active!=='N'),need=l.filter(p=>p.countMode==='Y').length,unset=l.filter(p=>!p.countMode).length;
  $('#setBody').innerHTML=`<div class="card" style="margin-bottom:16px"><div class="row" style="align-items:center">
    <div style="flex:2"><b>สินค้าที่ต้องนับทุกกะ: ${need} รายการ</b>${unset?` <span class="b b-warn">ยังไม่ได้ตั้ง ${unset}</span>`:''}<div class="hint">พนักงานต้องนับครบทุกตัวที่ "ต้องนับ" ก่อนปิดกะ · ไม่เห็นยอดในระบบ · เจ้าของตรวจและอนุมัติที่ สต็อก → ผลนับปิดกะ</div></div>
    <label class="f" style="margin:0">เกณฑ์ส่วนต่างเริ่มต้น (%)<input id="ctDef" type="number" step="any" value="${esc(S.settings.countTolerance||3)}"></label>
    <div class="fx0"><button class="btn p" onclick="ctDefSave()">${ico('save',16)} บันทึก</button></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" onclick="ctBulk('SELL')">สินค้าขายทั้งหมด → ต้องนับ</button><button class="btn sm" onclick="ctBulk('UNSET')">ตัวที่ยังไม่ตั้ง → ต้องนับ</button><button class="btn sm ol" onclick="ctBulk('NONE')">ทั้งหมด → ไม่ต้องนับ</button></div></div>
  <div class="card"><div class="tw"><table><tr><th>สินค้า</th><th>นับตอนปิดกะ</th><th>นับที่</th><th class="c">บังคับถ่ายรูป</th><th>ยอมคลาดเคลื่อน (%)</th></tr>
  ${l.map(p=>`<tr><td><span style="display:flex;gap:8px;align-items:center">${imgBox(p,34,30,19)}<span><b>${esc(p.name)}</b> <span class="muted small">${esc(p.unit)}</span></span></span></td>
    <td><select class="inp" style="min-width:150px;${!p.countMode?'border-color:var(--orange)':''}" onchange="ctSet('${p.id}','countMode',this.value)">${!p.countMode?'<option value="" selected disabled>ยังไม่ได้ตั้ง</option>':''}${opts({Y:'ต้องนับทุกกะ',N:'ไม่ต้องนับ'},p.countMode)}</select></td>
    <td><select class="inp" style="min-width:150px" onchange="ctSet('${p.id}','countLoc',this.value)">${opts({BOTH:'หน้า + หลังร้าน',FRONT:'หน้าร้าน',BACK:'หลังร้าน'},p.countLoc||'BOTH')}</select></td>
    <td class="c"><input type="checkbox" style="width:20px;height:20px" ${p.countPhoto==='Y'?'checked':''} onchange="ctSet('${p.id}','countPhoto',this.checked?'Y':'N')"></td>
    <td><input class="inp" type="number" step="any" style="width:110px" value="${p.tolerance!=null&&p.tolerance!==''?p.tolerance:''}" placeholder="${esc(S.settings.countTolerance||3)}" onchange="ctSet('${p.id}','tolerance',this.value)"></td></tr>`).join('')}</table></div></div>`;
}
async function ctSet(id,f,v){try{await call('setCountSettings',{items:[{id:id,[f]:v}]},true);const p=prod(id);if(p)p[f]=v;toast('บันทึกแล้ว');if(f==='countMode')setCount();}catch(e){}}
async function ctBulk(k){
  const l=S.products.filter(p=>p.active!=='N');
  const items=k==='SELL'?l.filter(p=>p.sellable!=='N').map(p=>({id:p.id,countMode:'Y'})):k==='UNSET'?l.filter(p=>!p.countMode).map(p=>({id:p.id,countMode:'Y'})):l.map(p=>({id:p.id,countMode:'N'}));
  if(!items.length)return toast('ไม่มีรายการที่ต้องเปลี่ยน');
  if(!confirm('เปลี่ยนการนับ '+items.length+' สินค้า ?'))return;
  try{await call('setCountSettings',{items:items});toast('บันทึก '+items.length+' สินค้าแล้ว');await reloadBase();setCount();}catch(e){}
}
async function ctDefSave(){const v=num($('#ctDef').value);try{await call('setCountSettings',{items:[],countTolerance:v});S.settings.countTolerance=String(v);toast('ตั้งเกณฑ์เริ่มต้น '+v+'% แล้ว');}catch(e){}}
function setUsers(){
  const us=S.users||[];
  $('#setBody').innerHTML=`${!S.settings.hasPin?`<div class="alert"><span style="display:flex;gap:8px;align-items:center">${ico('alert',18)} ยังไม่มีเจ้าของร้านในระบบ — ตอนนี้ทุกคนทำได้ทุกอย่าง กรุณาเพิ่ม "เจ้าของร้าน" คนแรกพร้อมรหัส</span></div>`:''}
  <div class="grid g2" style="grid-template-columns:1.4fr 1fr"><div class="card"><div class="ch"><h3>ผู้ใช้ทั้งหมด (${us.length})</h3><button class="btn p" onclick="userModal()">${ico('plus',16)} เพิ่มผู้ใช้</button></div>
    <div class="tw"><table><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>ลดราคา / เปลี่ยนราคา</th><th></th></tr>
    ${us.map(u=>`<tr><td><b>${esc(u.name)}</b> <span class="muted small">${u.id}</span></td><td>${u.role==='OWNER'?'<span class="b b-ok">เจ้าของร้าน</span>':'<span class="b b-mute">พนักงาน</span>'}</td><td>${u.canPrice?'<span class="b b-warn">ได้</span>':'<span class="muted">ไม่ได้</span>'}</td>
      <td class="nw"><button class="btn sm" onclick="userModal('${u.id}')">${ico('edit',14)} แก้ไข</button> <button class="btn sm ol" onclick="userDel('${u.id}')">ปิดใช้</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีผู้ใช้</td></tr>'}</table></div></div>
  <div class="card"><div class="ch"><h3>สิทธิ์ของแต่ละตำแหน่ง</h3></div>
    <div class="sec-t">ทุกคน (ไม่ต้องใส่รหัส)</div><div class="small" style="padding:6px 0">ขายของตามราคาที่ระบบให้, รับของเข้า, ย้ายสต็อก, แปรรูป, บันทึกค่าใช้จ่าย, รับชำระหนี้</div>
    <div class="sec-t">เปิด / ปิดกะ</div><div class="small" style="padding:6px 0">เลือกชื่อ + ใส่รหัสของคนนั้น ระบบบันทึกว่าใครเปิด ใครปิด</div>
    <div class="sec-t">พนักงานที่ได้สิทธิ์ลดราคา</div><div class="small" style="padding:6px 0">เปลี่ยนราคา / ให้ส่วนลดในบิล — ใส่รหัสทุกบิล ระบบบันทึกชื่อผู้ลดราคาไว้ในบิล</div>
    <div class="sec-t">เจ้าของร้าน</div><div class="small" style="padding:6px 0">ทุกอย่าง + หน้าตั้งค่า, รายงานกำไร, ยกเลิกบิล, ลบค่าใช้จ่าย, ตั้งราคาลูกค้า · ใส่รหัสครั้งเดียวใช้ได้ 15 นาที</div>
    <div class="hint" style="margin-top:8px">รหัสแต่ละคนต้องไม่ซ้ำกัน ทุกการแก้ไขดูย้อนหลังได้ที่แท็บ "ประวัติการแก้ไข"</div></div></div>`;
}
function userModal(id){
  const u=id?S.users.find(x=>x.id===id):{name:'',role:S.settings.hasPin?'STAFF':'OWNER',canPrice:false};
  modal(id?'แก้ไขผู้ใช้':'เพิ่มผู้ใช้',`<label class="f">ชื่อ (ที่จะแสดงในบิล/ประวัติ)<input id="usN" value="${esc(u.name)}" autofocus></label>
  <label class="f">ตำแหน่ง<select id="usR" onchange="$('#usCW').style.display=this.value==='OWNER'?'none':'flex'">${opts(ROLE_TH,u.role)}</select></label>
  <label class="small" id="usCW" style="display:${u.role==='OWNER'?'none':'flex'};gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="usC" ${u.canPrice?'checked':''}> ให้สิทธิ์ลดราคา / เปลี่ยนราคาหน้าร้าน</label>
  <div class="row"><label class="f">${id?'รหัสใหม่ (เว้นว่าง = ใช้รหัสเดิม)':'รหัส (ตัวเลข 4-6 หลัก)'}<input id="usP" type="password" inputmode="numeric" autocomplete="new-password"></label><label class="f">ยืนยันรหัส<input id="usP2" type="password" inputmode="numeric" autocomplete="new-password"></label></div>
  <div class="mact"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="userSave('${id||''}')">${ico('save',16)} บันทึก</button></div>`);
}
async function userSave(id){
  const pin=$('#usP').value.trim(),pin2=$('#usP2').value.trim(),role=$('#usR').value;
  if(!$('#usN').value.trim())return toast('ใส่ชื่อ','err');
  if(!id&&!pin)return toast('ตั้งรหัสให้ผู้ใช้ใหม่','err');
  if(pin&&!/^\d{4,6}$/.test(pin))return toast('รหัสต้องเป็นตัวเลข 4-6 หลัก','err');
  if(pin!==pin2)return toast('ยืนยันรหัสไม่ตรงกัน','err');
  const firstOwner=!S.settings.hasPin&&role==='OWNER';
  try{const r=await call('saveUser',{id:id,name:$('#usN').value,role:role,pin:pin,canPrice:$('#usC').checked});
    if(firstOwner&&pin)S.auth={pin:pin,user:r,at:Date.now()};
    else if(S.auth&&S.auth.user.id===r.id){S.auth.user=r;if(pin)S.auth.pin=pin;}
    toast('บันทึกผู้ใช้แล้ว');closeModal();await reloadBase();updLock();pgSettings();}catch(e){}
}
async function userDel(id){
  const u=S.users.find(x=>x.id===id);if(!confirm('ปิดใช้ '+u.name+' ? (รหัสนี้จะใช้ไม่ได้อีก ประวัติเดิมยังอยู่)'))return;
  try{await call('deleteUser',{id:id});if(S.auth&&S.auth.user.id===id)S.auth=null;toast('ปิดใช้แล้ว');await reloadBase();updLock();pgSettings();}catch(e){}
}
function setAudit(){
  const f=S.auF||(S.auF={from:addD(today(),-7),to:today(),userId:''});
  $('#setBody').innerHTML=`<div class="card"><div class="row"><label class="f">ตั้งแต่<input type="date" id="auF" value="${f.from}"></label><label class="f">ถึง<input type="date" id="auT" value="${f.to}"></label>
    <label class="f">ผู้ใช้<select id="auU"><option value="">ทุกคน</option>${(S.users||[]).map(u=>`<option value="${u.id}" ${u.id===f.userId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>
    <div class="fx0" style="margin-bottom:10px"><button class="btn p" onclick="S.auF={from:$('#auF').value,to:$('#auT').value,userId:$('#auU').value};auLoad()">ค้นหา</button></div></div><div id="auRes" class="empty">กำลังโหลด...</div></div>`;
  auLoad();
}
const AU_C={'ยกเลิกบิล':'b-bad','ลบค่าใช้จ่าย':'b-bad','ตัดของเสีย':'b-bad','ลด/เปลี่ยนราคาในบิล':'b-warn','ตั้งราคาลูกค้า':'b-warn','แก้ไขสินค้า':'b-blue','เปิดกะ':'b-ok','ปิดกะ':'b-ok'};
async function auLoad(){
  const r=await call('listAudit',S.auF,true);const el=$('#auRes');if(!el)return;el.className='';
  el.innerHTML=`<div class="tw"><table><tr><th>วันเวลา</th><th>ผู้ทำ</th><th>รายการ</th><th>อ้างอิง</th><th>รายละเอียด</th></tr>${r.map(a=>`<tr><td class="nw">${thDate(a.date)} ${a.time}</td><td class="nw"><b>${esc(a.userName)}</b></td><td class="nw"><span class="b ${AU_C[a.action]||'b-mute'}">${esc(a.action)}</span></td><td class="nw">${/^S\d/.test(a.ref)?`<a style="cursor:pointer;color:var(--blue)" onclick="openSale('${esc(a.ref)}')">${esc(a.ref)}</a>`:esc(a.ref)}</td><td class="small">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีรายการในช่วงนี้</td></tr>'}</table></div>`;
}
boot();
</script>
</body>
</html>
