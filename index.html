<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e3a27">
<title>กำลังโหลด...</title>
<link id="favIco" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e3a27'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23f5b82e' font-family='sans-serif' font-weight='700'%3EPOS%3C/text%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#f1f5f2;font-family:sans-serif;color:#1b2430}
.box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.sp{width:42px;height:42px;border:4px solid #dcfce7;border-top-color:#16a34a;border-radius:50%;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{background:#fff;border:2px solid #ef4444;border-radius:14px;padding:16px;max-width:460px}
button{font-size:16px;padding:10px 18px;border-radius:10px;border:0;background:#16a34a;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="ld"><div class="sp"></div><div>กำลังโหลดระบบ...</div></div>
<script>
(function(){
// ลิงก์เว็บแอป Apps Script (/exec) — ไฟล์นี้ไม่ต้องแก้อีก อัปเดตโปรแกรมที่ Apps Script ที่เดียว
var API='https://script.google.com/macros/s/AKfycbzVlNzERipYOBizYXjYaM7aKD5KNg5f1czRcG8rX6BYCLjWayzD6vC0TVySgSrjf8Ri/exec';
window.__LOADER_API=API;
var KEY='posUI';
function getCache(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
function setCache(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function show(html){document.open();document.write(html);document.close();}
function fetchUI(){
  return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'__ui'})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){if(!d||!d.ok||!d.res||!d.res.html)throw new Error((d&&d.error)||'โหลดหน้าเว็บไม่สำเร็จ');return d.res;});
}
function updBar(){
  var b=document.createElement('div');
  b.setAttribute('style','position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#0e3a27;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 20px #0004;font:15px sans-serif;display:flex;gap:12px;align-items:center');
  b.innerHTML='มีอัปเดตใหม่ <button style="background:#f5b82e;color:#1b2430;border:0;border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer">รีเฟรช</button>';
  b.querySelector('button').onclick=function(){location.reload();};
  (document.body||document.documentElement).appendChild(b);
}
var cache=getCache();
if(cache&&cache.html){
  setTimeout(function(){show(cache.html);},0);
  fetchUI().then(function(u){if(u.ver!==cache.ver||u.html!==cache.html){setCache(u);updBar();}}).catch(function(){});
}else{
  fetchUI().then(function(u){setCache(u);show(u.html);}).catch(function(e){
    document.getElementById('ld').innerHTML='<div class="err"><b>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</b><div style="margin:8px 0;color:#6b7280">'+(e&&e.message||e)+'<br>ตรวจอินเทอร์เน็ต หรือ Apps Script ยังไม่ได้ Deploy เวอร์ชันล่าสุด</div><button onclick="location.reload()">ลองใหม่</button></div>';
  });
}
})();
</script>
</body>
</html>
